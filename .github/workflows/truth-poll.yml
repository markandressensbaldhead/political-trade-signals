name: Public sources poll (free)

on:
  schedule:
    # Every 15 minutes — Truth Social, X, major news RSS/API
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: public-sources-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Poll public statements + analyze
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add GitHub repo secrets: APP_URL and CRON_SECRET"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/public-poll"
