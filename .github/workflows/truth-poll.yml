name: Truth Social poll (free)

on:
  schedule:
    # Every 15 minutes — free on GitHub Actions for public repos
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: truth-social-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poll Trump Truth Social RSS + analyze
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add GitHub repo secrets: APP_URL and CRON_SECRET"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/truth-poll"
